<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miwa App – prototype</title>
<style>
:root{box-sizing:border-box;--bg:#f4f7f2;--card:#fff;--tx:#17291b;--mut:#5d6f60;--g:#2e7d32;--gl:#e3f1e4;--r:#b3261e;--bd:#d7e2d6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a11;--card:#182a1b;--tx:#e8f2e8;--mut:#9db5a0;--g:#6fcf76;--gl:#1f3a23;--r:#ff8a80;--bd:#2a4330;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 16px 8px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{flex:1;padding:8px 16px 84px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:28px;font-weight:700;color:var(--g)}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}.neg{color:var(--r)}.mut{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:var(--g);font-weight:700}
.step{display:flex;gap:10px;padding:8px 0}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none;margin-top:2px}
.done .dot{background:var(--g);border-color:var(--g)}.now .dot{border-color:var(--g)}
.bar{height:10px;background:var(--gl);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.tag{background:var(--gl);color:var(--g);border-radius:8px;padding:2px 8px;font-size:12px}
.note{font-size:12px;color:var(--mut);margin-top:10px}.in{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.err{color:var(--r);font-size:13px;min-height:18px}.out{color:var(--g);cursor:pointer;text-decoration:underline}
</style></head><body><div class="app">
<header id="hd"></header>
<main id="m"></main>
<nav><button data-t="p" class="on">Passbook</button><button data-t="t">Tracker</button><button data-t="i">Inputs</button><button data-t="s">Basic phone</button></nav>
</div>
<script>
var PRICE=5750,TONNES=73.6,DEL=30,GROSS=DEL*PRICE;
var ded=[["Harvesting charges",8000],["Transport charges",5000],["Fertiliser on credit",15000]];
var LIMIT=Math.round(TONNES*PRICE*0.3);
var items=[["Filter-mud compost (mill by-product)","per tonne",900,"Mill by-product; improves soil structure and holds moisture"],
["NPK planting fertiliser","50 kg bag",3500,"Quantity based on soil test result"],
["Bio-fertiliser blend (bagasse ash + filter mud)","per 50 kg",1200,"Planned product; sample price"],["Quality seed cane (approved variety)","per tonne",4000,"Certified seed; sample price"]];
var user=null,tab="p",f=function(n){return "Sh "+Math.abs(n).toLocaleString("en-KE")};
function total(){return ded.reduce(function(a,b){return a+b[1]},0)}
function fert(){return ded[2][1]}
function view(){if(!user){return login()}document.querySelector("nav").style.display="flex";document.getElementById("hd").innerHTML='<h1>'+user+'</h1><p>Farm 0342-47 · Katito, Nyando Sub-County · 5 acres · <span class="out" id="out">Log out</span></p>';document.getElementById("out").onclick=function(){user=null;tab="p";view()};var h="";
if(tab=="p"){var d=total(),net=GROSS-d;
h+='<div class="card"><div class="mut">Expected net payment</div><div class="big">'+f(net)+'</div><div class="mut">after all deductions</div></div>';
h+='<div class="card"><b>Statement</b><div class="row"><span>Delivery #4471 (sample): '+DEL+' t × '+f(PRICE)+'</span><span>+'+f(GROSS)+'</span></div>';
ded.forEach(function(x){h+='<div class="row"><span>'+x[0]+'</span><span class="neg">−'+f(x[1])+'</span></div>'});
h+='<div class="row"><b>Balance</b><b>'+f(net)+'</b></div></div>';
h+='<div class="card"><b>Farm details</b><div class="row"><span>Farm number</span><span>0342-47</span></div><div class="row"><span>Location</span><span>Katito</span></div><div class="row"><span>Sub-county</span><span>Nyando</span></div><div class="row"><span>Farm size</span><span>5 acres</span></div><div class="row"><span>Pilot mill</span><span>Chemelil Sugar Factory</span></div></div>';h+='<p class="note">Price shown is the minimum cane price (Sh5,750/t); the final price follows the official formula. Demo figures only.</p>';}
if(tab=="t"){h+='<div class="card"><b>Crop progress</b><div class="mut">Planted 12 Nov 2025 · Variety: sample · 11.5 months</div><div class="bar"><i style="width:72%"></i></div><div class="mut">Estimated harvest: Oct–Nov 2026 · Est. '+TONNES+' t (±15%)</div></div>';
h+='<div class="card"><b>7-day payment countdown</b><div class="big">Day 2 of 7</div><div class="mut">An alert is sent if payment passes day 7 (demo).</div></div>';h+='<div class="card"><b>Payment tracker</b>';
[["Cane cut & loaded","done"],["Weighed at weighbridge: ticket #4471 (sample)","done"],["Price & deductions confirmed","now"],["Paid within 7 days (deadline shown here)","wait"]].forEach(function(s){h+='<div class="step '+s[1]+'"><span class="dot"></span><span>'+s[0]+'</span></div>'});
h+='</div><p class="note">The 7-day payment rule is the benchmark. If a payment passes day 7, the app flags it to the farmer and the group.</p>';}
if(tab=="s"){var nt=GROSS-total();h+='<div class="card"><b>No smartphone? Use any phone</b><div class="mut">Dial the Miwa code (demo: *000#) and choose:</div><div class="row"><span>1. My balance</span><span>'+f(nt)+'</span></div><div class="row"><span>2. Last delivery</span><span>'+DEL+' t</span></div><div class="row"><span>3. Payment status</span><span>Day 2 of 7</span></div><div class="row"><span>4. Input credit used</span><span>'+f(fert())+'</span></div></div><div class="card"><b>Sample SMS alert</b><div class="mut">MIWA: Delivery #4471, '+DEL+' t. Expected net '+f(nt)+'. Payment due by day 7.</div></div><div class="card"><b>Factory data not linked yet?</b><div class="mut">Enter or photograph your weighbridge ticket. We confirm it by SMS so your passbook stays up to date.</div></div>';}
if(tab=="i"){var left=LIMIT-fert();
h+='<div class="card"><div class="mut">Input credit available (30% of expected payment)</div><div class="big">'+f(left)+'</div><div class="mut">Used: '+f(fert())+' of '+f(LIMIT)+' · deducted automatically at harvest</div></div>';
items.forEach(function(x,i){h+='<div class="card"><b>'+x[0]+'</b> <span class="tag">on credit</span><div class="mut">'+x[3]+'</div><div class="row"><span>'+f(x[2])+' '+x[1]+'</span><button class="btn" data-i="'+i+'"'+(x[2]>left?" disabled":"")+'>Take on credit</button></div></div>'});
h+='<p class="note">Soil-test result decides recommended quantities. Organic by-products reduce, but do not replace, inorganic fertiliser. Credit comes from a financing partner; amount, charges, repayment terms and deductions are shown before you accept. Sample prices.</p>';}
document.getElementById("m").innerHTML=h}
document.querySelector("nav").onclick=function(e){var t=e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t==t)});view()};
document.getElementById("m").onclick=function(e){var i=e.target.dataset.i;if(i===undefined)return;ded[2][1]+=items[+i][2];view()};
function login(){document.querySelector("nav").style.display="none";document.getElementById("hd").innerHTML='<h1>🌱 Miwa App</h1><p>Sign in to see your account</p>';document.getElementById("m").innerHTML='<div class="card"><b>Welcome</b><div class="mut">Enter your username and password</div><label class="mut">Username</label><input class="in" id="u" autocomplete="off"><label class="mut">Password</label><input class="in" id="pw" type="password"><div class="err" id="er"></div><button class="btn" id="go" style="width:100%;padding:12px">Log in</button></div><p class="note">Demo: any username and password opens the sample account.</p>';document.getElementById("go").onclick=function(){if(!document.getElementById("u").value||!document.getElementById("pw").value){document.getElementById("er").textContent="Please enter both username and password.";return}user="ONGILI TONY ONYANGO";tab="p";document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t=="p")});view()}}
view();
</script></body></html>
